[Ocean & Boat Physics]

## If enabled, ocean wave simulation moves at normal real-time speed while time is accelerated, preventing violent wave physics. [Synced with Server]
# Setting type: Boolean
# Default value: true
Decouple Water Wave Speed = true

## If enabled, ocean waves are calmed and smoothed while night is accelerated. [Synced with Server]
# Setting type: Boolean
# Default value: true
Calm Ocean During Sleep = true

## Wave height multiplier applied when ocean calming is active (0.0 = completely flat, 1.0 = normal storm waves). [Synced with Server]
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Ocean Calm Multiplier = 0.5

## Prevents boats from taking spurious water impact damage from waves during accelerated sleep. [Synced with Server]
# Setting type: Boolean
# Default value: true
Prevent Boat Sleep Impact Damage = true

## Prevents camera screen shake caused by high-velocity wave wakes during accelerated sleep. [Synced with Server]
# Setting type: Boolean
# Default value: true
Suppress Boat Impact Screen Shake = true

[Server Settings]

## Default is false/disabled; Set to True/Enabled to resume Vanilla Sleep Start [Synced with Server]
# Setting type: Boolean
# Default value: false
Use Vanilla Sleep Start = true

