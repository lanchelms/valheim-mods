# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 1
Bonus Multiplier = 0.6

## Scales the bonus increment (added on top of normal time): extra rate = this × sleep fraction × 10. At 1.0 and all-but-one in bed, extra rate is 10 (time advances 11× vs vanilla dt alone). [Synced with Server]
