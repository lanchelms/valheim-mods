## Settings file was created by plugin Longship Upgrades v1.0.22
## Plugin GUID: shudnal.LongshipUpgrades

[Container]

## Container upgrades. Pls be aware items in upgraded slots will be unavailable after mod disabling. But it will drop on ship destruction.
# Setting type: Boolean
# Default value: true
Enable upgrades = true

## Width of ship container after first upgrade.
# Setting type: Int32
# Default value: 7
Upgrade - Lvl 1 - Container Width = 7

## Station localization token or prefab name. Matching is case-insensitive. The center of the ship is the starting point of the check.
# Setting type: String
# Default value: $piece_workbench
Upgrade - Lvl 1 - Station name = $piece_workbench

## Station level. At least one station in the range must meet the level requirement.
# Setting type: Int32
# Default value: 4
Upgrade - Lvl 1 - Station level = 4

## Station range check. You don't have to park the ship inside your main house to be able to upgrade it.
# Setting type: Int32
# Default value: 100
Upgrade - Lvl 1 - Station range = 100

## Container lvl 1 upgrade recipe. Item identifiers accept prefab names or localization tokens without case sensitivity. World restart or ship rebuild required to apply changes.
# Setting type: String
# Default value: ElderBark:20,Silver:5,Obsidian:10
Upgrade - Lvl 1 - Recipe = ElderBark:20,Silver:5,Obsidian:10

## Height of ship container after second upgrade.
# Setting type: Int32
# Default value: 4
Upgrade - Lvl 2 - Container Height = 4

