[config]
schemaVersion = "0.0.1"

[package]
namespace = "LanChelms"
name = "DeepNorthModpack"
versionNumber = "2.4.0"
description = "A pack of mods for the LanChelms Deep North Valheim server."
websiteUrl = "https://github.com/jterrace/lanchelms-valheim-mods"
containsNsfwContent = false

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./config"
target = "config"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://hexium.gg"
communities = [ "valheim" ]
[publish.categories]
valheim = [ "modpacks", "server-side", "client-side" ]

