## Settings file was created by plugin Shipwright's Touch v1.4.0
## Plugin GUID: com.malafein.shipwrightstouch

[Controls]

## Open the customization panel (name, sail color, sail texture) for the ship you are looking at (rudder, seats, mast, or hull).
# Setting type: KeyboardShortcut
# Default value: E + LeftShift
CustomizeShip = E + LeftShift

## Quickly cycle the sail color of the ship you are looking at through the presets. Unbound by default; the customization panel covers it.
# Setting type: KeyboardShortcut
# Default value: 
ChangeSailColor = E + LeftAlt

## Cycle the sail color of a ship while placing it with the hammer.
# Setting type: KeyboardShortcut
# Default value: E
ChangeSailColorWhilePlacing = E

## Open the sail texture moderation panel (server moderators and admins only). Unbound by default; the customization panel has a button for it.
# Setting type: KeyboardShortcut
# Default value: 
OpenModeration = 

[General]

## Allow deconstructing ships with the hammer (middle-mouse button).
# Setting type: Boolean
# Default value: false
AllowShipDeconstruction = true

## Automatically assign your character as the owner when constructing a ship, restricting modifications (renaming, recoloring, deconstruction) to yourself.
# Setting type: Boolean
# Default value: true
AssignBuilderIdentity = true

## Mouse-wheel scroll speed in the customization and moderation panels' lists. Higher scrolls faster. Applied each time a panel opens.
# Setting type: Single
# Default value: 300
ScrollSensitivity = 300

## Compress custom sail textures in video memory, like the game's own textures: about a quarter of the memory each, with slight artifacts on hard edges and smooth gradients. Turn off for exact images if you have memory to spare. Applies to textures loaded after the change (rejoin the world to reload them).
# Setting type: Boolean
# Default value: true
CompressTextures = true

[Server]

## Allow custom sail textures on this server at all. When off, every ship shows the vanilla sail to everyone, including a player's own textures on their own screen. Used when this game is the server (a dedicated server, or the player hosting). While connected to a server with this mod, these show the server's values, and its admins can change them here.
# Setting type: Boolean
# Default value: true
AllowCustomSailTextures = true

## Allow players to share their own sail textures with everyone. When off, nothing new is shared: players still see their own textures on their own ships, everyone else sees the server's textures, textures approved earlier, or the vanilla sail. Used when this game is the server (a dedicated server, or the player hosting). While connected to a server with this mod, these show the server's values, and its admins can change them here.
# Setting type: Boolean
# Default value: true
AllowPlayerSailTextures = true

## New player textures stay visible only to the player who shared them until a moderator or admin approves them. When off, they're shown to everyone right away; moderators can still deny one later. Used when this game is the server (a dedicated server, or the player hosting). While connected to a server with this mod, these show the server's values, and its admins can change them here.
# Setting type: Boolean
# Default value: true
RequireApproval = false

## Largest texture a player may share, in KB, measured after it's converted to PNG for sharing (a JPG or a carefully compressed PNG can grow). This sets download time and the server's disk use; video memory depends only on MaxTextureSize. Used when this game is the server (a dedicated server, or the player hosting). While connected to a server with this mod, these show the server's values, and its admins can change them here.
# Setting type: Int32
# Default value: 2048
# Acceptable value range: From 64 to 4096
MaxTextureFileKB = 2048

## Largest width or height, in pixels, of a texture a player may share. Used when this game is the server (a dedicated server, or the player hosting). While connected to a server with this mod, these show the server's values, and its admins can change them here.
# Setting type: Int32
# Default value: 1024
# Acceptable value range: From 64 to 2048
MaxTextureSize = 1024

## How many textures each player may share (at least 1). Used when this game is the server (a dedicated server, or the player hosting). While connected to a server with this mod, these show the server's values, and its admins can change them here.
# Setting type: Int32
# Default value: 10
MaxTexturesPerPlayer = 25

## Automatically deny an upload that held more than image data (moderators see it flagged as "unexpected content" either way). The game never sends such files itself, so it means a modified game or a hand-made file. Players are only ever sent the server's own clean copy, so this is about keeping such uploads off ships, not about safety. The uploader sees it as auto-denied, and a moderator can still approve it. Used when this game is the server (a dedicated server, or the player hosting). While connected to a server with this mod, these show the server's values, and its admins can change them here.
# Setting type: Boolean
# Default value: false
AutoDenyUnexpectedContent = false

## Only let players join who have a version of Shipwright's Touch this server can talk to. Others are turned away with the game's "incompatible version" message; players already connected without it get a 10 second warning, then are disconnected (their character is saved). Turned on automatically by EnemiesIgnoreUnoccupiedShips and RescueCapsizedShips, and stays on if those are turned off again. Used when this game is the server (a dedicated server, or the player hosting). While connected to a server with this mod, these show the server's values, and its admins can change them here.
# Setting type: Boolean
# Default value: false
RequireMatchingMod = true

## Safe Harbor: monsters don't go after a ship with nobody aboard. One already attacking keeps at it until you come back and deal with it, and a ship next to a fight can still be hit. Players' games run the monsters, so this turns RequireMatchingMod on. Used when this game is the server (a dedicated server, or the player hosting). While connected to a server with this mod, these show the server's values, and its admins can change them here.
# Setting type: Boolean
# Default value: false
EnemiesIgnoreUnoccupiedShips = false

## Safe Harbor: a capsized ship still takes damage, but never below 10% of its health, and anyone can turn it upright by holding the interact key on it. Players' games run the ships, so this turns RequireMatchingMod on. Used when this game is the server (a dedicated server, or the player hosting). While connected to a server with this mod, these show the server's values, and its admins can change them here.
# Setting type: Boolean
# Default value: false
RescueCapsizedShips = false

[Sharing]

## On a server with this mod, share a texture from your sails folder with the server the first time you put it on a ship, so other players can see it (if the server allows it, possibly after a moderator's approval). When off, your textures show only for you.
# Setting type: Boolean
# Default value: true
ShareMyTextures = true

## Show and download the sail textures other players have shared on the server. When off, their ships show the vanilla sail to you. The server's own textures still show.
# Setting type: Boolean
# Default value: true
ShowOtherPlayersTextures = true

## Speed limit for sending sail textures, in KB per second: on a player's game for sharing a texture, on the server for sending textures to each player. 0 means no limit, as fast as the connection allows. The game already limits each connection to 150 KB/s, shared with world updates, so this can only slow transfers down, leaving more room for the world while a texture is sent. Choices: 0, 8, 16, 32, 64, 128; any other value counts as 0.
# Setting type: Int32
# Default value: 0
# Acceptable values: 0, 8, 16, 32, 64, 128
MaxTransferKBPerSecond = 0

